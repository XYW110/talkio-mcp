# 构建并发布 Docker 镜像到 Docker Hub。
#
# 触发规则：
#   - push 到 master     → 更新 latest
#   - push 语义化 tag    → 打 <version>（如 0.1.0）与 <major>.<minor>（如 0.1）
#   - workflow_dispatch  → 手动触发
#
# 前置配置（仓库 Settings → Secrets and variables → Actions → New repository secret）：
#   DOCKERHUB_USERNAME  Docker Hub 的 Docker ID（登录用户名，不是 Display Name）
#   DOCKERHUB_TOKEN     Docker Hub Access Token（权限选 Read & Write）
name: Docker Publish

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

# 同一 ref 的发布串行执行，避免并发 push 冲突（不打断进行中的发布）。
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

# 仅镜像仓库名，不含命名空间；完整镜像名为 <DOCKERHUB_USERNAME>/<IMAGE_NAME>。
# 命名空间取自 secret，避免硬编码后在用户名不符时静默推错位置。
env:
  IMAGE_NAME: talkio-mcp

jobs:
  quality:
    name: Quality gate (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  publish:
    name: Build and push image
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
