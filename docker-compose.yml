services:
  talkio-mcp:
    build: .
    ports:
      - "3100:3100"
    # .env 存在则注入 API 密钥（OPENAI_API_KEY 等），缺失也不阻止启动。
    # 没有密钥时仍可用 TALKIO_MOCK_PROVIDER=1 跑 mock 模式。
    env_file:
      - path: .env
        required: false
    # 配置挂载为可写：管理界面保存配置会回写该文件（重启容器后生效）。
    # 注意：容器以非 root 的 talkio 用户运行，若管理界面保存失败，
    # 请确保宿主机上该文件对容器用户可写（如 chmod 666 experts.json）。
    # 若只需只读部署（改文件 + 重启），可改回 ":ro"。
    # 注意：全新 clone 且宿主机尚无 experts.json 时，请先注释掉下面这行挂载，
    # 否则 Docker 会把缺失的挂载点创建成目录导致读配置失败；
    # 此时容器将使用镜像内置的脱敏默认配置（需 OPENAI_API_KEY 或 TALKIO_MOCK_PROVIDER=1）。
    volumes:
      - ./experts.json:/app/experts.json
    restart: unless-stopped
